<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Enable the reveal-on-scroll hidden state only when JS is present, so
         content never collapses to opacity:0 without JS. Must run before CSS. -->
    <script>
      document.documentElement.className += " js";
    </script>
    <title>BRDB — Coming soon | Inteople</title>
    <meta
      name="description"
      content="A new Inteople venture site is on the way." />
    <meta name="robots" content="noindex,follow" />

    <link rel="icon" href="/assets/images/icons/favicon-32.png" sizes="32x32" />
    <link
      rel="apple-touch-icon"
      href="/assets/images/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="/assets/styles/tokens.css" />
    <link rel="stylesheet" href="/assets/styles/base.css" />
    <link rel="stylesheet" href="/assets/styles/home.css" />
  </head>
  <body>
    <main id="main">
      <section
        class="page-hero"
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          text-align: center;
        ">
        <div class="container page-hero-inner">
          <a
            class="brand"
            href="https://inteople.com/"
            aria-label="Inteople home"
            style="justify-content: center; margin-bottom: var(--sp-6)">
            <img
              src="/assets/images/brand/logo-mark.webp"
              alt=""
              width="40"
              height="40" />
            Inteople
          </a>
          <span class="pill on-dark"
            ><span class="dot"></span> Coming soon</span
          >
          <h1 style="margin-top: var(--sp-4)">
            BRDB <span class="grad-text">is on the way</span>.
          </h1>
          <p class="lead" style="margin-inline: auto">
            A new venture engineered and operated by Inteople. This site is
            being built — check back soon, or reach us in the meantime.
          </p>
          <div style="margin-top: var(--sp-6)">
            <a
              class="btn btn-primary btn-lg"
              href="mailto:hello@inteople.com?subject=BRDB%20inquiry"
              >Get in touch</a
            >
            <a class="btn btn-on-dark btn-lg" href="https://inteople.com/"
              >Visit Inteople</a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
