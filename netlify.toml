# Netlify configuration — static site, auto-deploys from GitHub
[build]
  publish = "."
  command = ""

# Long-cache shared assets (styles, scripts, images) — served from /assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers across the whole site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Pretty URLs: /vc/alisohel -> /vc/alisohel.html
[[redirects]]
  from = "/vc/:slug"
  to = "/vc/:slug.html"
  status = 200

# Preserve the public /edu/ URL after moving the folder to /sites/edu.
# (The URL /edu/ is published in sitemap.xml and must keep working.)
[[redirects]]
  from = "/edu/*"
  to = "/sites/edu/:splat"
  status = 200

[[redirects]]
  from = "/edu"
  to = "/sites/edu/index.html"
  status = 200

# Subdomain: serve edu.inteople.com root from /sites/edu (URL stays on the
# subdomain). Only the bare root is rewritten; assets under /assets/* fall
# through to normal file serving from the shared publish root.
# INERT until a Netlify domain alias + DNS CNAME for edu.inteople.com exist.
[[redirects]]
  from = "https://edu.inteople.com/"
  to = "/sites/edu/index.html"
  status = 200
  force = true

# Subdomain: serve brdb.inteople.com root from /sites/brdb.
# INERT until a Netlify domain alias + DNS CNAME for brdb.inteople.com exist.
[[redirects]]
  from = "https://brdb.inteople.com/"
  to = "/sites/brdb/index.html"
  status = 200
  force = true
