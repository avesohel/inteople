# Netlify configuration — static site, auto-deploys from GitHub
[build]
  publish = "."
  command = ""

# Long-cache static assets (styles, scripts, images).
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers across the whole site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Pretty URLs: /vc/alisohel -> /vc/alisohel.html
[[redirects]]
  from = "/vc/:slug"
  to = "/vc/:slug.html"
  status = 200

# EduNation AI landing — serve /edu without the trailing index.html
[[redirects]]
  from = "/edu"
  to = "/edu/index.html"
  status = 200

# Subdomain: serve edu.inteople.com root from the /edu/ folder (URL stays on the
# subdomain). Only the bare root is rewritten; assets like /edu/edu.css and
# /src/images/* fall through to normal file serving from the shared publish root.
# INERT until a Netlify domain alias + DNS CNAME for edu.inteople.com exist.
[[redirects]]
  from = "https://edu.inteople.com/"
  to = "/edu/index.html"
  status = 200
  force = true
